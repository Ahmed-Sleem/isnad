[build-system]
requires = ["setuptools>=80,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "isnad-core"
version = "0.1.0"
description = "Source-grounded citation verification core."
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi==0.142.2",
  "httpx==0.28.1",
  "pydantic==2.13.4",
  "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.3",
  "ruff==0.16.10",
  "setuptools==84.0.0",
  "wheel==0.48.0",
]
mcp = ["mcp==2.3.0"]
# Optional: drives the served interface in a real browser (tests/test_gui_browser.py).
# Needs `python -m playwright install chromium` once per machine.
browser = ["playwright==1.63.0"]
litellm = ["litellm==1.104.0"]
integrations = ["mcp==2.3.0", "litellm==1.104.0"]

[project.scripts]
isnad-mcp = "isnad_core.integrations.mcp_server:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
isnad_core = [
  "data/quran/*.xml",
  "data/quran/*.json",
  "data/quranenc/english_saheeh/*.json",
  "api/templates/*.html",
  "api/static/*.html",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
